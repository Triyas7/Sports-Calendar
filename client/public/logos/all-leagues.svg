<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="allGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#0575e6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing ring -->
  <circle cx="32" cy="32" r="29" fill="#0d1117" stroke="url(#allGrad)" stroke-width="2.5" />
  <!-- Latitude & Longitude lines for global/all feel -->
  <ellipse cx="32" cy="32" rx="14" ry="28" fill="none" stroke="rgba(56, 239, 125, 0.35)" stroke-width="1.2" />
  <line x1="4" y1="32" x2="60" y2="32" stroke="rgba(56, 239, 125, 0.35)" stroke-width="1.2" />
  <ellipse cx="32" cy="20" rx="22" ry="6" fill="none" stroke="rgba(56, 239, 125, 0.25)" stroke-width="1" />
  <ellipse cx="32" cy="44" rx="22" ry="6" fill="none" stroke="rgba(56, 239, 125, 0.25)" stroke-width="1" />
  <!-- Central Classic Football Pentagon & Nodes -->
  <polygon points="32,23 39,28 36,36 28,36 25,28" fill="url(#allGrad)" filter="url(#glow)" />
  <line x1="32" y1="23" x2="32" y2="15" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <line x1="39" y1="28" x2="47" y2="25" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <line x1="36" y1="36" x2="42" y2="44" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <line x1="28" y1="36" x2="22" y2="44" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <line x1="25" y1="28" x2="17" y2="25" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <!-- Stars for leagues -->
  <circle cx="32" cy="9" r="1.5" fill="#38ef7d" />
  <circle cx="53" cy="21" r="1.5" fill="#38ef7d" />
  <circle cx="47" cy="50" r="1.5" fill="#38ef7d" />
  <circle cx="17" cy="50" r="1.5" fill="#38ef7d" />
  <circle cx="11" cy="21" r="1.5" fill="#38ef7d" />
</svg>
